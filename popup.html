<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"></head>
<body>
  <main class="card">
    <header class="header">
        <div class="brand"><img class="logo" src="bale-logo.png" alt="Messenger"><div><h1 id="app-title">Chat Export</h1><p id="app-subtitle">Bale · Eitaa · Rubika</p></div></div>
      <span class="badge">LOCAL</span>
    </header>
    <div class="separator"></div>
    <section class="settings" aria-label="Export settings">
      <label class="setting-row" for="media"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span><span class="setting-copy"><strong>Include media</strong><small>Photos, video, voice and files</small></span><span class="switch"><input id="media" type="checkbox" checked><span></span></span></label>
      <label class="field" for="timeout"><span>History loading limit</span><span class="select-wrap"><select id="timeout"><option value="5">5 minutes</option><option value="15" selected>15 minutes</option><option value="30">30 minutes</option><option value="0">No time limit</option></select><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></label>
    </section>
    <button id="export" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg><span>Export open chat</span></button>
    <button id="cancel" class="secondary" hidden>Cancel export</button>
    <section class="status-card" aria-live="polite"><span class="status-dot"></span><div id="status" role="status">Open a conversation in Bale, Eitaa, or Rubika Web first.</div></section>
    <progress id="progress" max="100" value="0" hidden></progress>
    <footer><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Processed privately on this device</span></footer>
  </main><script src="popup.js"></script>
</body></html>
